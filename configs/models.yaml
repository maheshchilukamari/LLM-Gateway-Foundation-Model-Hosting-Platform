models:
  - id: distilgpt2
    provider: huggingface
    model_family: gpt2
    model_version: "1.0"
    task_type: text-generation
    context_window: 1024
    device: cpu
    average_latency_ms: 850
    estimated_cost_per_1k_tokens: 0.0001
    max_batch_size: 4
    availability: enabled
    health_status: HEALTHY
    quality_score: 0.60
    throughput_score: 0.70
    supported_capabilities:
      - text-generation
      - chat-completion
    deployment_target: local
    governance:
      owner: platform-team
      approval_status: approved-for-demo
      license: mit
      source: https://huggingface.co/distilgpt2
      risk_level: medium
