[project]
name = "llm-gateway-platform"
version = "0.1.0"
description = "Production-style LLM Gateway and foundation model hosting platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "redis>=5.0.0",
  "SQLAlchemy>=2.0.0",
  "greenlet>=3.0.0",
  "alembic>=1.13.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "psutil>=6.0.0",
  "opentelemetry-api>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]
phase2 = [
  "torch>=2.4.0",
  "transformers>=4.44.0",
  "sentence-transformers>=3.0.0",
]
loadtest = [
  "locust>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
